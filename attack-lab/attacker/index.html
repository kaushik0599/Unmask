<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>attacker.localhost — collector</title>
<style>
  body {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: #0b0d11;
    color: #e8e2d8;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .box {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 32px 40px;
    text-align: center;
    min-width: 420px;
  }
  .origin { color: #44506a; font-size: 12px; margin-bottom: 20px; letter-spacing: 0.08em; }
  .label { font-size: 13px; color: #8a94a8; margin-bottom: 8px; }
  .value { font-size: 22px; font-weight: 700; }
  .none { color: #22c55e; }
  .got { color: #ef4444; }
  .detail { margin-top: 16px; font-size: 12px; color: #8a94a8; word-break: break-all; }
</style>
</head>
<body>
  <div class="box">
    <div class="origin">http://attacker.localhost:6020 — attacker-controlled collector</div>
    <div class="label">ATTACKER RECEIVED:</div>
    <div class="value" id="value">CHECKING…</div>
    <div class="detail" id="detail"></div>
  </div>

<script>
  // This page has no relationship to UNMASK - it is simply a plain HTTP
  // endpoint an attacker fully controls, polling its own /status to show
  // whatever the server has actually received (or not received).
  async function poll() {
    try {
      const res = await fetch('/status');
      const data = await res.json();
      const valueEl = document.getElementById('value');
      const detailEl = document.getElementById('detail');
      if (!data.received) {
        valueEl.textContent = 'NO DATA';
        valueEl.className = 'value none';
        detailEl.textContent = 'UNMASK blocked the request before it reached this server.';
      } else {
        valueEl.textContent = 'DATA CAPTURED';
        valueEl.className = 'value got';
        detailEl.textContent = `At ${data.receivedAt} — body: ${data.body}`;
      }
    } catch (_) {
      // ignore transient poll failures
    }
  }
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
